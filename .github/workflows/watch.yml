name: watch

on:
  schedule:
    # 9am / 1pm / 5pm US Eastern (EDT). Times shift an hour in winter; GitHub cron is UTC-only.
    - cron: "0 13,17,21 * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email with fake postings instead of checking the feed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new postings
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python watch.py ${{ inputs.test_email && '--test-email' || '' }}

      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain state/seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: update seen state"
            git push
          fi
