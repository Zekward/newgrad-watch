name: collect

on:
  schedule:
    # Every 4 hours. Banks whatever appeared since the last run; sends nothing.
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python collect.py

      - name: Commit store
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: collect postings"
            # notify.py commits the watermark on its own schedule, so rebase before pushing.
            git pull --rebase --autostash
            git push
          fi
